<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {%- feed_meta -%}
  </head>
  <body>
    {% assign current_url = page.url | replace: 'index.html', '' %}
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
      <div class="container-fluid site-nav-inner">
        <a class="navbar-brand site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="siteNavbar">
          <div class="navbar-nav ms-auto">
            <a class="nav-link {% if current_url == '/' %}active{% endif %}" {% if current_url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
            <a class="nav-link {% if current_url == '/research/' %}active{% endif %}" {% if current_url == '/research/' %}aria-current="page"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
            <a class="nav-link {% if current_url == '/teaching/' %}active{% endif %}" {% if current_url == '/teaching/' %}aria-current="page"{% endif %} href="{{ '/teaching/' | relative_url }}">Teaching</a>
            <a class="nav-link {% if current_url == '/cv/' %}active{% endif %}" {% if current_url == '/cv/' %}aria-current="page"{% endif %} href="{{ '/cv/' | relative_url }}">CV</a>
          </div>
        </div>
      </div>
    </nav>

    {{ content }}

    <footer class="site-footer">
      &copy; {{ 'now' | date: '%Y' }} {{ site.title }}
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      function toggleAbstract(button) {
        const panel = button.nextElementSibling;
        const isOpen = panel.classList.toggle('is-open');
        button.textContent = isOpen ? 'Hide Abstract' : 'Show Abstract';
      }
    </script>
  </body>
</html>
